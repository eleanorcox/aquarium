# Publishes the site to GitHub Pages on every push to main, once the tests pass.
# The address (aquarium.eleanorcox.rocks) is set in the repository's Settings → Pages, not here.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publish at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installing also copies the hand-tracking runtime into public/, so it is part of the site.
      - run: npm ci
      - run: npm test
      # Where phones send their fish: set as a repository variable once the service is on Cloudflare.
      - run: npm run build
        env:
          VITE_VISITOR_SERVICE: ${{ vars.VISITOR_SERVICE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
